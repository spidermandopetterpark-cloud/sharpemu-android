name: SharpEmu Android ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Instalar Android workload
        run: |
          dotnet workload install android

      - name: Criar projeto Android
        run: |
          rm -rf AndroidApp
          mkdir -p AndroidApp

          cat > AndroidApp/SharpEmu.Android.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">

            <PropertyGroup>
              <TargetFramework>net10.0-android</TargetFramework>
              <OutputType>Exe</OutputType>

              <RootNamespace>SharpEmu.Android</RootNamespace>
              <ApplicationId>com.sharpemu.android</ApplicationId>
              <ApplicationTitle>SharpEmu</ApplicationTitle>

              <SupportedOSPlatformVersion>26</SupportedOSPlatformVersion>

              <RuntimeIdentifiers>android-arm64</RuntimeIdentifiers>
              <RuntimeIdentifier>android-arm64</RuntimeIdentifier>

              <AndroidPackageFormat>apk</AndroidPackageFormat>
            </PropertyGroup>

            <ItemGroup>
              <ProjectReference Include="../src/SharpEmu.Core/SharpEmu.Core.csproj" />
            </ItemGroup>

          </Project>
          EOF

      - name: Criar MainActivity
        run: |
          cat > AndroidApp/MainActivity.cs <<'EOF'
          using global::Android.App;
          using global::Android.OS;
          using global::Android.Widget;
          using global::Android.Views;

          namespace SharpEmu.Android;

          [Activity(
              Label = "SharpEmu",
              MainLauncher = true,
              Exported = true,
              ScreenOrientation = global::Android.Content.PM.ScreenOrientation.Landscape
          )]
          public class MainActivity : Activity
          {
              protected override void OnCreate(Bundle? savedInstanceState)
              {
                  base.OnCreate(savedInstanceState);

                  var layout = new LinearLayout(this)
                  {
                      Orientation = Orientation.Vertical
                  };

                  var title = new TextView(this)
                  {
                      Text = "SharpEmu",
                      TextSize = 28
                  };

                  var status = new TextView(this)
                  {
                      Text = "SharpEmu ARM64 Android"
                  };

                  layout.AddView(title);
                  layout.AddView(status);

                  SetContentView(layout);
              }
          }
          EOF

      - name: Restaurar
        run: |
          dotnet restore AndroidApp/SharpEmu.Android.csproj

      - name: Compilar APK ARM64
        run: |
          dotnet publish AndroidApp/SharpEmu.Android.csproj \
            -c Release \
            -f net10.0-android \
            -r android-arm64 \
            --self-contained true \
            -p:AndroidPackageFormat=apk \
            -o artifacts/apk

      - name: Verificar APK
        run: |
          echo "===== APK GERADO ====="
          find artifacts/apk -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SharpEmu-Android-ARM64
          path: artifacts/apk/*.apk
