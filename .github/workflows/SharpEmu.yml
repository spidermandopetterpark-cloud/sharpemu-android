name: SharpEmu Android ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Instalar workloads Android
        run: |
          dotnet workload install android

      - name: Restaurar
        run: |
          dotnet restore

      - name: Compilar APK ARM64
        run: |
          dotnet publish \
            -c Release \
            -f net8.0-android \
            -r android-arm64 \
            --self-contained true \
            -p:AndroidPackageFormats=apk \
            -p:AndroidSupportedAbis=arm64-v8a \
            -o build/apk

      - name: Procurar APK
        run: |
          find build/apk -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SharpEmu-Android-arm64
          path: build/apk/*.apk
